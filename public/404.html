<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Redirigiendo al portafolio de José Emilio Sánchez Miñón."
    />
    <title>José Emilio Sánchez Miñón</title>
    <script>
      // GitHub Pages SPA redirect: store the path in sessionStorage and
      // redirect to the root so React Router can handle it.
      var path =
        window.location.pathname +
        window.location.search +
        window.location.hash;
      sessionStorage.setItem("redirect", path);
      window.location.replace("/");
    </script>
  </head>
  <body></body>
</html>
